name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  web-unit-tests:
    name: Web Client Unit Tests
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run web client unit tests
        run: npm run test:web:unit

  api-unit-tests:
    name: API Server Unit Tests
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: api-server/go.sum

      - name: Run API server unit tests
        run: ./scripts/run-tests.sh api-unit

  api-integration-tests:
    name: API Server Integration Tests
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: api-server/go.sum

      - name: Create .env.test file
        working-directory: api-server
        run: |
          if [ ! -f .env.test ]; then
            cp .env.test.example .env.test
          fi

      - name: Run API server integration tests
        run: ./scripts/run-tests.sh api-integration

  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: api-server/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Create .env.e2e files
        run: |
          if [ ! -f api-server/.env.e2e ]; then
            cp api-server/.env.e2e.example api-server/.env.e2e
          fi
          if [ ! -f web-client/.env.e2e ]; then
            echo "VITE_API_BASE_URL=http://127.0.0.1:4002/api" > web-client/.env.e2e
          fi

      - name: Run end-to-end tests
        run: npm run test:web:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web-client/playwright-report/
          retention-days: 30
