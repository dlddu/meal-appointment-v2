name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  web-unit-tests:
    name: Web Client Unit Tests
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run web client unit tests
        run: npm run test:web:unit

  api-unit-tests:
    name: API Server Unit Tests
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run API server unit tests
        run: npm run test:api:unit

  api-integration-tests:
    name: API Server Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: meal_user
          POSTGRES_PASSWORD: meal_pass
          POSTGRES_DB: meal_appointment_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env.test file
        working-directory: api-server
        run: |
          if [ ! -f .env.test ]; then
            cp .env.test.example .env.test
          fi

      - name: Run API server integration tests
        run: npm run test:api:integration
        env:
          DATABASE_URL: >-
            postgresql://meal_user:meal_pass@localhost:5432/meal_appointment_test

  e2e-tests:
    name: End-to-End Tests (kind)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.24.0
          cluster_name: meal-appointment-e2e
          config: e2e/kind-config.yaml

      - name: Run end-to-end tests against kind cluster
        run: npm run test:web:e2e

      - name: Dump kind cluster diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n meal-appointment-e2e describe deployment meal-appointment-e2e || true
          kubectl -n meal-appointment-e2e logs deployment/meal-appointment-e2e --all-containers --tail=400 || true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web-client/playwright-report/
          retention-days: 30
