# Implemented for spec: agent/specs/meal-appointment-local-testing-spec.md
# kind cluster definition used by the E2E test pipeline.
# Host ports match the Playwright baseURL (5173) and the API base URL (4002)
# so that the existing specs can talk to services running inside the cluster.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: meal-appointment-e2e
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30173
        hostPort: 5173
        listenAddress: 127.0.0.1
        protocol: TCP
      - containerPort: 30400
        hostPort: 4002
        listenAddress: 127.0.0.1
        protocol: TCP
