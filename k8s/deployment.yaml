apiVersion: apps/v1
kind: Deployment
metadata:
  name: meal-appointment
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: meal-appointment
  template:
    metadata:
      labels:
        app: meal-appointment
    spec:
      containers:
        - name: api-server
          image: ghcr.io/dlddu/meal-appointment-v2/api-server:latest
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              /app/migrate
              /app/seed
              exec /app/server
          env:
            - name: PORT
              value: "4000"
            - name: LOG_LEVEL
              value: info
            - name: DATABASE_URL
              value: ./data/meal_appointment.db
            - name: MIGRATION_FILE
              value: /app/migrations/0001_init.sql
          ports:
            - name: api
              containerPort: 4000
          readinessProbe:
            httpGet:
              path: /api/health
              port: api
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 30
          volumeMounts:
            - mountPath: /app/data
              name: database
        - name: web-client
          image: ghcr.io/dlddu/meal-appointment-v2/web-client:latest
          env:
            - name: VITE_API_BASE_URL
              value: https://meal-appointment.${PUBLIC_DOMAIN}/api
          ports:
            - name: web
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 30
      imagePullSecrets:
        - name: ghcr
      volumes:
        - name: database
          persistentVolumeClaim:
            claimName: meal-appointment
