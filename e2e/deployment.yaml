# Implemented for spec: agent/specs/meal-appointment-local-testing-spec.md
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meal-appointment-e2e
  namespace: meal-appointment-e2e
  labels:
    app: meal-appointment-e2e
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: meal-appointment-e2e
  template:
    metadata:
      labels:
        app: meal-appointment-e2e
    spec:
      containers:
        - name: api-server
          image: meal-appointment-api:e2e
          imagePullPolicy: Never
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              npx tsx scripts/migrate.ts
              node dist/prisma/seed.js
              npm start
          env:
            - name: PORT
              value: "4000"
            - name: NODE_ENV
              value: e2e
            - name: LOG_LEVEL
              value: warn
            - name: DATABASE_URL
              value: ./data/meal_appointment_e2e.db
          ports:
            - name: api
              containerPort: 4000
          readinessProbe:
            httpGet:
              path: /api/health
              port: api
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 30
          volumeMounts:
            - mountPath: /app/api-server/data
              name: database
        - name: web-client
          image: meal-appointment-web:e2e
          imagePullPolicy: Never
          ports:
            - name: web
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 30
      volumes:
        - name: database
          emptyDir: {}
